name: Compose Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Salin file environment
        run: cp .env.example .env

      - name: Validasi konfigurasi Docker Compose
        run: docker compose config -q
